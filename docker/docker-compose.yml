# Minimal Camunda 8.9 stack for demoing the Jev Router connector.
# Derived from camunda/camunda-distributions (camunda-8.9, lightweight profile):
# orchestration (Zeebe + Operate + Tasklist) backed by H2, plus the connectors
# bundle with this connector's jar mounted in. No Elasticsearch, no Identity.
#
# For local development only. Not a production topology.

name: jev-demo

services:
  # Fixes ownership on the data volume before orchestration starts.
  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.9.21}
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
      - chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"
    networks:
      - jev

  orchestration:
    image: camunda/camunda:${CAMUNDA_VERSION:-8.9.21}
    container_name: jev-orchestration
    ports:
      - "26500:26500"   # gRPC (Modeler deploys here)
      - "8080:8080"     # REST API + Operate / Tasklist UI
      - "9600:9600"     # actuator / health
    mem_limit: 2g
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"
      interval: 2s
      retries: 60
      start_period: 30s
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    networks:
      - jev
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

  connectors:
    image: camunda/connectors-bundle:${CAMUNDA_CONNECTORS_VERSION:-8.9.12}
    container_name: jev-connectors
    ports:
      - "8086:8080"
    environment:
      # The Connector Runtime only exposes env vars prefixed SECRET_ as connector
      # secrets, so {{secrets.TYPESAFE_API_KEY}} resolves from SECRET_TYPESAFE_API_KEY.
      SECRET_TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:?TYPESAFE_API_KEY is not set - run ./jev doctor}
    mem_limit: 512m
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 20s
    volumes:
      # /opt/custom is the bundle's documented drop-in path for extra connectors.
      - ../target/jev-router-connector-0.1.0-SNAPSHOT.jar:/opt/custom/jev-router-connector.jar:ro
    configs:
      - source: connectors-config
        target: /application.yaml
    networks:
      - jev
    depends_on:
      orchestration:
        condition: service_healthy

volumes:
  camunda:
  camunda-data:

networks:
  jev:
    name: jev-demo

configs:
  connectors-config:
    content: |
      camunda:
        client:
          mode: self-managed
          grpc-address: http://orchestration:26500
          rest-address: http://orchestration:8080
      management:
        endpoints:
          web:
            exposure:
              include: health,configprops
        endpoint:
          health:
            probes:
              enabled: true

  orchestration-config:
    content: |
      management.endpoints.configprops.show-values: always
      camunda:
        backup:
          webapps:
            enabled: false
        system:
          cpu-thread-count: "3"
          io-thread-count: "3"
        security:
          authentication:
            method: "basic"
            unprotectedApi: true
          authorizations:
            enabled: false
          initialization:
            users:
              - username: "demo"
                password: "demo"
                name: "Demo User"
                email: "demo@demo.com"
            defaultRoles.admin.users:
              - "demo"
        data:
          secondary-storage:
            type: rdbms
            rdbms:
              url: jdbc:h2:file:./camunda-data/h2db
              username: sa
              password:
              flushInterval: PT0.5S
              queueSize: 1000
